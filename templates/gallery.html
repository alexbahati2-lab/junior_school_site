{% extends 'base.html' %}
{% block content %}

<h1 style="text-align:center; margin-top:20px;">Gallery</h1>

{% if images %}
<div class="gallery-container">
    {% for img in images %}
        <div class="gallery-item">
            <img src="{{ img.image.url }}" alt="{{ img.caption }}">
            <p>{{ img.caption }}</p>
        </div>
    {% endfor %}
</div>
{% else %}
<p style="text-align:center; margin-top:40px; font-size:18px; color:gray;">
    No gallery images uploaded yet.
</p>
{% endif %}

<style>
.gallery-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    padding: 20px;
}

.gallery-item {
    text-align: center;
}

.gallery-item img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
</style>

{% endblock %}
